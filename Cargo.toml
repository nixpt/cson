[package]
name = "cson"
version = "0.1.0"
edition = "2021"
description = "CSON — Crush Semantic Object Notation: an AI-native config/serialization format (confidence, semantic keys, annotations, synthesized values)"
repository = "https://github.com/nixpt/cson"
license = "MIT OR Apache-2.0"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

